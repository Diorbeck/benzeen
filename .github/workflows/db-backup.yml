name: Daily DB Backup

# Daily logical backup of the production PostgreSQL database.
#
# The dump contains customer PII (phone numbers, addresses). This repository is
# PUBLIC, so the artifact is ALWAYS encrypted at rest with AES-256-CBC before it
# leaves the runner — the job hard-fails rather than ever writing a plaintext
# dump. pg_dump (-Fc) → gzip → openssl enc. The connection string and passphrase
# are passed via env and never printed to logs or placed on argv.
#
# Required repo secrets:
#   DATABASE_URL            full postgres connection string (prod)
#   BACKUP_PASSPHRASE       symmetric passphrase used to encrypt/decrypt the dump
# Optional repo secrets (enable S3 mirror of the ENCRYPTED file when all set):
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION              e.g. eu-central-1
#   BACKUP_S3_BUCKET        e.g. s3://my-bucket/benzeen-backups
#
# Restore instructions: docs/BACKUP.md

on:
  schedule:
    # 02:00 UTC every day (~07:00 Tashkent).
    - cron: '0 2 * * *'
  workflow_dispatch: {}

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install PostgreSQL 16 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          sudo sed -i 's|deb |deb [signed-by=/usr/share/keyrings/postgresql.gpg] |' /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Create encrypted dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set"; exit 1
          fi
          # Refuse to run without a passphrase — a public repo must never hold a
          # plaintext dump with customer PII.
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE secret is not set — refusing to write an unencrypted dump"; exit 1
          fi
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          FILE="benzeen-${STAMP}.dump.gz.enc"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          # pg_dump custom format (-Fc: compressed, selective restore) → gzip →
          # AES-256-CBC (PBKDF2, random salt). Secrets stay in env; nothing
          # sensitive is echoed or passed on the command line.
          set -o pipefail
          pg_dump --no-owner --no-privileges -Fc "$DATABASE_URL" \
            | gzip \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_PASSPHRASE \
            > "$FILE"
          # Sanity: the encrypted file must exist and be non-empty.
          test -s "$FILE"
          ls -lh "$FILE"

      - name: Upload artifact (private, 14-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 14
          if-no-files-found: error

      - name: Mirror encrypted dump to S3 (optional)
        # NB: the `secrets` context is NOT allowed in a step `if:`, so we gate on
        # the env values inside the script instead (unset → skip, not fail).
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$BUCKET" ]; then
            echo "S3 not configured (AWS_ACCESS_KEY_ID / BACKUP_S3_BUCKET unset) — skipping mirror."
            exit 0
          fi
          aws s3 cp "$FILE" "$BUCKET/$FILE" --only-show-errors
          echo "Uploaded encrypted $FILE to $BUCKET"
